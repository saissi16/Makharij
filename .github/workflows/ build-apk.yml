name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Add voice (text to speech) plugin
        run: npm install @capacitor-community/text-to-speech@5 --legacy-peer-deps
      - name: Add Android project
        run: npx cap add android
      - name: Allow microphone and speech recognition
        run: python3 scripts/patch_android.py
      - name: Allow voice engine lookup
        run: sed -i 's#</queries>#<intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>#' android/app/src/main/AndroidManifest.xml
      - name: Copy web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makharij-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
